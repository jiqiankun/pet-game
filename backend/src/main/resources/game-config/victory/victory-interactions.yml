  - { id: VI_BOSS_GENERIC_CR, winnerType: BOSS, contexts: [ CRUSHED ],
      presentationType: DIALOGUE, weight: 80, text: "在我的力量面前，你毫无还手之力。" }
  - { id: VI_BOSS_GENERIC_RP, winnerType: BOSS, contexts: [ REPEATED_DEFEAT ],
