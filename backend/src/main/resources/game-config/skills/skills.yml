# ============================================================
# 宠物精灵游戏 - 技能配置（阶段 3 战斗引擎核心，修订 REV-001/REV-014）
# ============================================================
# 技能配置驱动：引擎不针对具体技能 ID 写分支。
# 效果 = 基础值 + 多个属性系数（支持 maxOf 取较高者）；支持多效果组合与蓄力。
# element 允许 NONE（无属性：无克制、无本属性加成）。
# 技能按「来源 × 类型」两维度建模（需求 §23）：
#   source：INNATE（自身，默认）/ BOOK（技能书），省略时按默认值 INNATE；
#   skillType：ACTIVE（主动，默认）/ PASSIVE（被动）。
# 同一 skillId 可被多个宠物引用（技能共享，需求 §149），禁止复制定义。
# ============================================================

