        name: 古代药园
        rewards:
          - { itemId: ITEM_POTION_LARGE, qtyMin: 1, qtyMax: 2 }
        goldMin: 30
        goldMax: 60
      - gatherId: GATHER_RUINS_2
        name: 遗迹宝箱残骸
        rewards:
          - { itemId: ITEM_REVIVE, qtyMin: 1, qtyMax: 1 }
        goldMin: 40
        goldMax: 80
    chests:
      - chestId: CHEST_RUINS_HIDDEN_1
        name: 远古宝库
        rewards:
          - { itemId: ITEM_POTION_LARGE, qtyMin: 2, qtyMax: 4 }
          - { itemId: ITEM_CAPTURE_BALL_ULTRA, qtyMin: 2, qtyMax: 4 }
          - { itemId: ITEM_REVIVE, qtyMin: 2, qtyMax: 3 }
        goldMin: 300
        goldMax: 500
