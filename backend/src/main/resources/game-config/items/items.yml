# ============================================================
# 宠物精灵游戏 - 道具配置（阶段 4：恢复道具基础）
# ============================================================
# 阶段 4 恢复道具；阶段 5 补入捕捉球（需求 §48）。
# 技能书（阶段 10）、材料（掉落）后续阶段补入。
# 玩家存档只存道具 ID 与数量（player_inventory），不复制配置内容。
# ============================================================

configVersion: 1

items:
  # ---------- 恢复类 ----------
  - id: ITEM_POTION_SMALL
    name: 小型恢复药
    description: 为一只宠物恢复 50 点生命值。
    category: RECOVERY
    itemType: HEAL_HP
    value: 50
    usableOutsideBattle: true
    usableInBattle: true
    discardable: true

  - id: ITEM_POTION_MEDIUM
    name: 中型恢复药
    description: 为一只宠物恢复 150 点生命值。
    category: RECOVERY
    itemType: HEAL_HP
    value: 150
    usableOutsideBattle: true
    usableInBattle: true
    discardable: true

  - id: ITEM_REVIVE
    name: 复苏药剂
    description: 复活一只倒下的宠物并恢复 50% 最大生命值。
    category: RECOVERY
    itemType: REVIVE
    value: 50
    usableOutsideBattle: true
    usableInBattle: true
    discardable: true

  - id: ITEM_POTION_LARGE
    name: 大型恢复药
    description: 为一只宠物恢复 400 点生命值。
    category: RECOVERY
    itemType: HEAL_HP
    value: 400
    usableOutsideBattle: true
    usableInBattle: true
    discardable: true

  # ---------- 捕捉类（阶段 5：仅 3 档，需求 §48） ----------
  - id: ITEM_CAPTURE_BALL_NORMAL
    name: 普通捕捉球
    description: 基础捕捉球，捕获倍率 ×1.0。捕捉失败时被消耗。
    category: CAPTURE
    itemType: CAPTURE_BALL
    value: 1.0
    usableOutsideBattle: false
    usableInBattle: true
    discardable: true

  - id: ITEM_CAPTURE_BALL_GREAT
    name: 高级捕捉球
    description: 进阶捕捉球，捕获倍率 ×1.5。捕捉失败时被消耗。
    category: CAPTURE
    itemType: CAPTURE_BALL
    value: 1.5
    usableOutsideBattle: false
    usableInBattle: true
    discardable: true

  - id: ITEM_CAPTURE_BALL_ULTRA
    name: 特级捕捉球
    description: 顶级捕捉球，捕获倍率 ×2.5。捕捉失败时被消耗。
    category: CAPTURE
    itemType: CAPTURE_BALL
    value: 2.5
    usableOutsideBattle: false
    usableInBattle: true
    discardable: true

  # ---------- 技能书（阶段 9 教学赠送入背包，阶段 10 正式学习使用） ----------
  - id: ITEM_SKILL_BOOK_LEAVE_ALIVE
    name: 技能书·留生一击
    description: 学习后永久掌握【留生一击】技能。致死时将可捕捉目标 HP 保留为 1 并附加震慑。
    category: SKILL_BOOK
    itemType: SKILL_BOOK
    value: 0
    usableOutsideBattle: true
    usableInBattle: false
    discardable: false
