# ============================================================
# 宠物精灵游戏 - 初始宠物配置
# ============================================================
# 定义新游戏三选一的初始宠物选项（阶段 5 起种族数据唯一来源为 pets/pets.yml）。
# 初始宠物综合资质至少 A（各项 >= 80，启动校验强制）。
# 初始道具：阶段 5 起新游戏赠送三档捕捉球（用户裁决）；
# 另赠送少量小型恢复药（HP 跨战斗保留、营地阶段 6 才实装，保障前期续航与验收）。
# ============================================================

configVersion: 1

initialGold: 500
initialExpPool: 0
initialMapId: MAP_START_VILLAGE

initialItems:
  - { itemId: ITEM_CAPTURE_BALL_NORMAL, quantity: 10 }
  - { itemId: ITEM_CAPTURE_BALL_GREAT, quantity: 5 }
  - { itemId: ITEM_CAPTURE_BALL_ULTRA, quantity: 2 }
  - { itemId: ITEM_POTION_SMALL, quantity: 10 }
  - { itemId: ITEM_REVIVE, quantity: 2 }

# 新游戏赠送技能（REV-014，需求 §142.6）：留生一击为阶段 5 临时获取途径，
# 正式获取（商店常驻低价/捕捉教学赠书）属阶段 9/10。
grantSkills:
  - SKILL_LEAVE_AT_ONE_HP

initialPets:
  - speciesId: PET_FIRE_001
    aptitudeHp: 85
    aptitudeStrength: 90
    aptitudeSpirit: 80
    aptitudeDefense: 85
    aptitudeResistance: 80
    aptitudeSpeed: 85

  - speciesId: PET_WATER_001
    aptitudeHp: 90
    aptitudeStrength: 80
    aptitudeSpirit: 90
    aptitudeDefense: 85
    aptitudeResistance: 85
    aptitudeSpeed: 80

  - speciesId: PET_WOOD_001
    aptitudeHp: 88
    aptitudeStrength: 82
    aptitudeSpirit: 85
    aptitudeDefense: 85
    aptitudeResistance: 82
    aptitudeSpeed: 83
