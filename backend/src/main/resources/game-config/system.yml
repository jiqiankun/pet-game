# ============================================================
# 宠物精灵游戏 - 系统规则配置
# ============================================================
# 定义游戏核心数值规则。所有倍率、上限、数量均可通过外部配置覆盖。
# 修改后需重启生效。
# ============================================================

configVersion: 1

# ---- 属性克制倍率 ----
advantageMultiplier: 1.50
neutralMultiplier: 1.00
disadvantageMultiplier: 0.75

# ---- 本属性技能加成 ----
sameElementBonus: 1.20

# ---- 暴击 ----
critRate: 0.05
critMultiplierMin: 1.4
critMultiplierMax: 2.0

# ---- 等级与属性点 ----
levelCap: 50
freePointsPerLevel: 3
# 稀有度每 10 级额外自由点数（需求 §19：普通 0 / 稀有 2 / 珍稀 4 / 传说 6）
rarityExtraPointsPer10Levels:
  COMMON: 0
  RARE: 2
  EPIC: 4
  LEGENDARY: 6
# 升级经验公式：升到下一级所需经验 = expBase * expGrowthFactor^(当前等级-1)
# 需求 §17 未给具体数值，此公式配置化以便调整
expBase: 100
expGrowthFactor: 1.15
# 属性点转换消耗（需求 §20）
# 生命 +5 消耗 hpPointCost(1) 点；力量/灵力/防御/抗性 +1 消耗 statPointCost(1) 点；速度 +1 消耗 speedPointCost(2) 点
statPointCost: 1
hpPointCost: 1
speedPointCost: 2

# ---- 队伍 ----
maxCarryPets: 6
standardBattleSlots: 3
maxTeamPresets: 5

# ---- 资质 ----
aptitudeMin: 0
aptitudeMax: 100

# ---- 个体基础浮动（±5%） ----
baseStatVariance: 0.05

# ---- 战斗结算（阶段 3） ----
# 防御/抗性减伤：raw × K / (K + def)
defenseMitigationConstant: 200.0
# 防御行动减伤比例
defendDamageReduction: 0.50
# 正常命中最低伤害
minDamage: 1
# 自由属性点加成
freePointStatValue: 1.0
freePointHpValue: 5.0
# 等级成长（阶段 3 临时公式，阶段 4 养成体系正式化）
levelStatGrowth: 2.0
levelHpGrowth: 8.0

# ---- 放生 ----
releaseBonusMax: 0.50

# ---- 捕捉（阶段 5，需求 §46～§50） ----
# 捕获率 = 基础捕获率 × (1 - captureHpFactor × 当前HP比例) × (1 + statusCaptureBonus × min(异常数, captureStatusMaxCount))
#        × 捕捉球倍率 × 精英系数，最终 clamp 到 [0, 1]
captureHpFactor: 0.5
# 每个异常状态（DEBUFF/CONTROL）的捕获率加成
statusCaptureBonus: 0.15
# 异常状态捕获加成最多计数的状态个数
captureStatusMaxCount: 2
# 精英个体捕捉倍率（决策一 ×0.6；本阶段无精英个体）
eliteCaptureMultiplier: 0.6
# 逃跑成功率（用户裁决：必定成功）
fleeSuccessRate: 1.0
# 野生宠物低概率携带稀有技能的概率
rareSkillChance: 0.05
# 野生宠物极低概率特殊外观的概率
specialAppearanceChance: 0.01

# ---- 精英个体（阶段 10，需求 §57） ----
eliteSpawnChance: 0.05          # 精英出现概率
eliteLevelBonusMin: 2           # 等级加成下限
eliteLevelBonusMax: 5           # 等级加成上限
eliteMinAptitudeFloor: 60       # 精英最低资质下限（普通为 0）
eliteRareSkillChanceBonus: 0.15 # 稀有技能额外概率

# ---- 特殊外观变体（阶段 10，需求 §57） ----
# 替代原有单一 SPECIAL 标记，多种变体按概率独立抽取
specialAppearanceVariants:
  - { id: APPEARANCE_SHINY, chance: 0.005, description: "异色个体" }
  - { id: APPEARANCE_GLOW, chance: 0.003, description: "辉光个体" }

# ---- 放生礼物（阶段 5，决策七） ----
# 礼物价值点数 = 基础值(稀有度) × 捕获等级系数(1+等级×1%，上限 1.5) × 培养系数(1.0～1.5)
releaseGiftBaseValue:
  COMMON: 20
  RARE: 60
  EPIC: 150
  LEGENDARY: 400
releaseLevelFactorPerLevel: 0.01
releaseLevelFactorCap: 1.5
releaseCultivationFactorMax: 1.5
# 培养系数满值所需已分配自由点数（培养系数 = 1 + min(已分配点数/该值, 1) × (上限-1)）
releaseCultivationPointsCap: 100
# 放生高资质额外警告阈值（平均资质 ≥ 该值时前端二次确认）
releaseWarningAptitudeThreshold: 90

# ---- 野生战斗奖励（阶段 5，用户裁决） ----
# 奖励 = 每级基础值(刷新组) × 敌等级 × 稀有度系数；被捕捉宠物不参与奖励计算
wildRewardRarityMultiplier:
  COMMON: 1.0
  RARE: 1.2
  EPIC: 1.5
  LEGENDARY: 2.0

# ---- Boss ----
luckyExchangeCost: 100
# HP 百分比交换（命运天平类，需求 §147）：Boss 单次交换幅度上限（百分点）
bossHpExchangeLimit: 0.20

# ---- Boss 控制抗性（阶段 7，需求 §43 + 决策六）----
# 异常成功率修正：NORMAL 无抗性、ELITE -20%、BOSS -40%
controlResistance:
  NORMAL: 1.0
  ELITE: 0.80
  BOSS: 0.60
# 连续控制衰减：第 1/2/3 次施加控制的成功率修正
consecutiveControlDecay: [1.0, 0.7, 0.4]
# 第 4 次及以后保持下限
consecutiveControlMin: 0.4
# 连续 N 回合未受控归零
controlDecayResetRounds: 2

# ---- Boss AI 决策参数（阶段 7 Boss AI 改造）----
# 仅供 BossDecisionProvider 评分使用，不参与实际战斗结算；
# 不读取玩家等级/战力，难度仅来源于 Boss 配置与战场状态（需求 §80）。
bossAi:
  healTriggerHpPercent: 0.40       # 友方 HP% 低于该值时治疗优先级明显提高
  healNoNeedHpPercent: 0.90        # 友方 HP% 高于该值时治疗候选大幅降权
  healUrgencyMultiplier: 1.8       # 低血治疗紧迫度倍率
  killBonusPercent: 0.6            # 可斩杀目标时的额外奖励比例
  lowHpTargetWeight: 0.5           # 低血目标加权系数
  controlBaseScore: 60.0           # 控制技能基础分
  utilityBaseScore: 40.0           # 减益/增益技能基础分
  existingControlPenalty: 0.10     # 目标已受控时的评分惩罚倍率
  statusEffectBonus: 0.10          # 攻击技能附加状态效果估值比例
  tieTolerance: 0.05               # 接近分容差（接近分候选间随机）
  phaseAttackMultipliers: [1.0, 1.3, 1.6]   # 阶段攻击倍率（一阶段均衡/二阶段进攻/三阶段爆发）
  phaseControlMultipliers: [1.0, 0.8, 1.2]  # 阶段控制倍率（三阶段关键控制回升）
  phaseHealMultipliers: [1.0, 0.8, 0.6]     # 阶段治疗倍率（后期降权）

# ---- 玩家自动战斗决策参数（阶段 10 自动战斗策略系统）----
# 仅供 AutoBattleDecisionProvider 评分使用，不参与实际战斗结算；
# 四套策略（均衡/进攻/稳健/捕捉）通过 strategyWeights 权重表差异化；
# 不读取玩家等级/战力做动态缩放，决策仅来源于配置与战场状态。
autoBattle:
  tieTolerance: 0.05               # 接近分容差（接近分候选间随机）
  killBonusPercent: 0.6            # 可斩杀目标时的额外奖励比例
  lowHpTargetWeight: 0.5           # 低血目标加权系数
  overkillWastePenalty: 0.4        # 高冷却高伤打极低血目标的降权比例
  overkillLowHpPercent: 0.05       # 高伤浪费判定的目标低血阈值
  highCooldownThreshold: 3         # 高冷却定义（cooldown >= 该值）
  finisherHpThreshold: 0.30        # FINISHER 标签生效的目标 HP% 阈值
  healHpThresholds: [0.70, 0.50, 0.30]        # 治疗三段阈值
  healUrgencyMultipliers: [1.2, 1.6, 2.2]     # 对应紧迫度倍率
  healNoNeedHpPercent: 0.90        # 接近满血时治疗大幅降权
  controlBaseScore: 60.0           # 控制技能基础分
  utilityBaseScore: 40.0           # 辅助/增益技能基础分
  existingControlPenalty: 0.15     # 目标已受控时的控制评分惩罚倍率
  defendBaseScore: 1.0             # 防御保底候选基础分
  aggressiveSurvivalFloor: 0.15    # 进攻策略生存底线（低于该 HP% 生存修正回升）
  defensiveHealEarly: 0.50         # 稳健策略提前恢复阈值
  captureDangerHp: 0.40            # 捕捉危险血量区（低于该值计算误杀风险）
  captureKillPenalty: 0.95         # 误杀风险惩罚比例
  captureAssistLeaveAliveBonus: 80.0  # 留生一击（LEAVE_AT_ONE_HP）捕捉区额外奖励
  captureReadyBonus: 300.0         # 目标 1 HP + 震慑时的捕捉巨额加成
  captureRateScoreFactor: 200.0    # 捕捉率换算捕捉行动分系数
  captureMinRate: 0.45             # 捕捉行动最低捕捉率门槛（1HP+震慑不受限）
  balanceMinBenefit: 0.25          # 命运天平最低净收益阈值
  balanceBossMinBenefit: 0.45      # 目标为 Boss 时命运天平更高阈值
  reviveDangerEnemyRatio: 0.5      # 复苏危险判定：敌方存活比例阈值
  reviveEnemyNearlyDeadPercent: 0.10  # 敌人即将被斩杀时复苏降权阈值
  # 策略权重表：策略 × 语义标签（未列出的标签默认 1.0）
  strategyWeights:
    BALANCED:
      DAMAGE: 1.0
      FINISHER: 1.1
      HEAL: 1.0
      SURVIVAL: 1.0
      CONTROL: 1.0
      CAPTURE_ASSIST: 0.3
      DISPEL: 1.0
      SHIELD_BREAK: 1.0
      ACTION_ORDER: 1.0
      LIFE_STEAL: 1.0
      CAPTURE_ACTION: 0.2
      SWITCH_ACTION: 1.0
    AGGRESSIVE:
      DAMAGE: 1.4
      FINISHER: 1.5
      HEAL: 0.6
      SURVIVAL: 0.7
      CONTROL: 0.8
      CAPTURE_ASSIST: 0.2
      DISPEL: 0.8
      SHIELD_BREAK: 1.3
      ACTION_ORDER: 0.8
      LIFE_STEAL: 1.2
      CAPTURE_ACTION: 0.1
      SWITCH_ACTION: 0.6
    DEFENSIVE:
      DAMAGE: 0.8
      FINISHER: 0.9
      HEAL: 1.5
      SURVIVAL: 1.4
      CONTROL: 1.2
      CAPTURE_ASSIST: 0.3
      DISPEL: 1.4
      SHIELD_BREAK: 0.9
      ACTION_ORDER: 1.1
      LIFE_STEAL: 1.0
      CAPTURE_ACTION: 0.2
      SWITCH_ACTION: 1.4
    CAPTURE:
      DAMAGE: 0.7
      FINISHER: 0.3
      HEAL: 1.0
      SURVIVAL: 1.1
      CONTROL: 1.2
      CAPTURE_ASSIST: 2.0
      DISPEL: 0.8
      SHIELD_BREAK: 0.7
      ACTION_ORDER: 0.8
      LIFE_STEAL: 0.9
      CAPTURE_ACTION: 1.0
      SWITCH_ACTION: 1.0
  # 定位权重表：宠物定位 × 语义标签（未配置定位时按基础属性推断）
  roleWeights:
    DAMAGE:
      DAMAGE: 1.2
      FINISHER: 1.3
      SHIELD_BREAK: 1.2
      HEAL: 0.9
      SURVIVAL: 0.9
      CONTROL: 0.9
    TANK:
      SURVIVAL: 1.3
      CONTROL: 1.2
      DAMAGE: 0.9
      HEAL: 1.0
      FINISHER: 0.9
    SUPPORT:
      HEAL: 1.4
      DISPEL: 1.3
      ACTION_ORDER: 1.2
      SURVIVAL: 1.2
      DAMAGE: 0.8
      FINISHER: 0.8
    CONTROL:
      CONTROL: 1.4
      ACTION_ORDER: 1.2
      DAMAGE: 0.95

# ---- 图鉴（阶段 8，决策五）----
# 研究值与等级门槛全部配置化，阶段 12 数值平衡时微调。
pokedex:
  levelThresholds:
    "1": 10
    "2": 30
    "3": 60
    "4": 100
    "5": 150
  firstDiscoveryPoints: 5
  firstCapturePoints: 10
  subsequentCapturePoints: 2
  battleParticipationPoints: 1
  battleWinPoints: 1
  skillUnlockPoints: 2
  highAptitude80Points: 5
  highAptitude90Points: 8
  rareSkillDiscoveryPoints: 5
  specialAppearancePoints: 10
  eliteCapturePoints: 8
  aptitudeGrades:
    S: 90
    A: 80
    B: 65
    C: 50
