  - { id: VI_WILD_EASTER, winnerType: WILD_PET, presentationType: ACTION_NARRATION,
      actionId: BOW, weight: 100, rarity: EASTER_EGG,
      text: "{winnerName} 竟向你深深鞠了一躬，仿佛在致敬你的挑战。" }

  # ---------------- 训练师（TRAINER）----------------
  # 训练师公共池（style 为空）
  - { id: VI_TRAINER_NORMAL, winnerType: TRAINER, contexts: [ NORMAL_LOSS ],
      presentationType: DIALOGUE, weight: 100, text: "失去斗志可不行，回去好好培养伙伴再来吧。" }
  - { id: VI_TRAINER_CLOSE, winnerType: TRAINER, contexts: [ CLOSE_LOSS ],
      presentationType: DIALOGUE, weight: 80, text: "好险好险，差点就被你赢了。下次可没这么走运。" }
  - { id: VI_TRAINER_CRUSHED, winnerType: TRAINER, contexts: [ CRUSHED ],
      presentationType: DIALOGUE, weight: 80, text: "看来你和你的伙伴还差得远呢。" }
  - { id: VI_TRAINER_COMEBACK, winnerType: TRAINER, contexts: [ COMEBACK_LOSS ],
      presentationType: DIALOGUE, weight: 70, text: "你一度让我很紧张，但最终还是我技高一筹。" }
