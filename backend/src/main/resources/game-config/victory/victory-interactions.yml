# ============================================================
# 宠物精灵游戏 - 敌方胜利互动配置（阶段 12）
# ============================================================
# 战败表现增强：玩家战败后，根据获胜方类型 + 战况标签，从本文件中选择一条互动返回前端播放。
# 只做表现，不参与战斗数值计算、不改变战败结算；无匹配时回退默认旁白，前端隐藏互动区。
#
# 字段说明（see VictoryInteractionConfig.Interaction）：
#   - winnerType：获胜方类型 TRAINER / WILD_PET / BOSS（由战斗类型映射）
#   - style：风格。训练师用 victoryStyle（ARROGANT/SMUG/SARCASTIC/PLAYFUL/CALM/
#       HOT_BLOODED/VILLAIN/GENTLE），野外宠物用 victoryBehavior
#       （PROUD/PLAYFUL/FEROCIOUS/CALM/CURIOUS/TIMID/LAZY/MISCHIEVOUS）。
#       style 为空 = 通用公共池（所有同 winnerType 敌人均可使用）。
#   - targetId：指定获胜方 ID（可选，用于 Boss/精英专属）。null = 通用。
#   - contexts：战况标签列表（空 = 适用所有战况）：
#       NORMAL_LOSS 普通 / CLOSE_LOSS 惜败(胜方剩≤15%) / CRUSHED 碾压(胜方剩≥85%)
#       COMEBACK_LOSS 先倒后输(玩家曾击败敌方) / REPEATED_DEFEAT 宿敌(连续战败≥2)
#       EXCESSIVE_HEAL 过度治疗 / EXCESSIVE_SWITCH 频繁换宠 / REPEATED_SKILL 重复技能
#   - presentationType：DIALOGUE 台词 / ACTION_NARRATION 动作旁白 / CRY 叫声
#   - actionId：可选动作 ID（无对应资源时前端降级为纯文本）
#   - cry：可选叫声文本
#   - weight：权重（越大越常见）
#   - rarity：COMMON 普通 / EASTER_EGG 彩蛋（低概率 1% 入场）
#   - text：互动文本（台词或旁白）
#
# 选择策略：专属(targetId) → 公共池(style 匹配) → 仅 winnerType+context 回退；
# 同层内按权重随机，排除最近播放的 5 条防重复；彩蛋稀有度以 1% 概率入场。
# ============================================================

configVersion: 1
interactions:
  # ---------------- Boss 专属（targetId）----------------
  # 青草原守护者
  - { id: VI_BOSS_MEADOW_1, winnerType: BOSS, style: ARROGANT, targetId: BOSS_MEADOW_GUARDIAN,
      contexts: [ NORMAL_LOSS, CLOSE_LOSS ], presentationType: DIALOGUE,
      text: "青草地的风记住了你的坚持。下次，让风也为你让路。" }
  - { id: VI_BOSS_MEADOW_2, winnerType: BOSS, style: ARROGANT, targetId: BOSS_MEADOW_GUARDIAN,
      contexts: [ CRUSHED ], presentationType: DIALOGUE,
      text: "青草摇曳，你连一片叶子都没惊动。回去再练练吧。" }
  - { id: VI_BOSS_MEADOW_3, winnerType: BOSS, style: GENTLE, targetId: BOSS_MEADOW_GUARDIAN,
      contexts: [ COMEBACK_LOSS, REPEATED_DEFEAT ], presentationType: DIALOGUE,
      text: "你很强，只差一点。青草地随时欢迎你再来。" }
  # 翠林之王
  - { id: VI_BOSS_FOREST_1, winnerType: BOSS, style: SMUG, targetId: BOSS_FOREST_KING,
      contexts: [ NORMAL_LOSS, CLOSE_LOSS ], presentationType: DIALOGUE,
      text: "翠林的每片叶子都在为我鼓掌。你听见了吗？" }
  - { id: VI_BOSS_FOREST_2, winnerType: BOSS, style: SMUG, targetId: BOSS_FOREST_KING,
      contexts: [ CRUSHED ], presentationType: DIALOGUE,
      text: "森林之王岂是浪得虚名。你的脚步声，还太轻。" }
  - { id: VI_BOSS_FOREST_3, winnerType: BOSS, style: PLAYFUL, targetId: BOSS_FOREST_KING,
      contexts: [ COMEBACK_LOSS, REPEATED_DEFEAT ], presentationType: DIALOGUE,
      text: "有意思，你进步了。下次让我认真一点。" }
  # 水域守护者
  - { id: VI_BOSS_WATERS_1, winnerType: BOSS, style: CALM, targetId: BOSS_WATERS_GUARDIAN,
      contexts: [ NORMAL_LOSS, CLOSE_LOSS ], presentationType: DIALOGUE,
      text: "水流不争，却能穿石。你的勇气，我已收下。" }
  - { id: VI_BOSS_WATERS_2, winnerType: BOSS, style: CALM, targetId: BOSS_WATERS_GUARDIAN,
      contexts: [ CRUSHED ], presentationType: DIALOGUE,
      text: "深水无声。你连水花都没激起。" }
  - { id: VI_BOSS_WATERS_3, winnerType: BOSS, style: GENTLE, targetId: BOSS_WATERS_GUARDIAN,
      contexts: [ COMEBACK_LOSS, REPEATED_DEFEAT ], presentationType: DIALOGUE,
      text: "缘起缘落皆在潮中。待潮起时，我们再会。" }
  # 雷域守护者
  - { id: VI_BOSS_THUNDER_1, winnerType: BOSS, style: HOT_BLOODED, targetId: BOSS_THUNDER_GUARDIAN,
      contexts: [ NORMAL_LOSS, CLOSE_LOSS ], presentationType: DIALOGUE,
      text: "雷声隆隆，是我在对你说：还不够快！" }
  - { id: VI_BOSS_THUNDER_2, winnerType: BOSS, style: HOT_BLOODED, targetId: BOSS_THUNDER_GUARDIAN,
      contexts: [ CRUSHED ], presentationType: DIALOGUE,
      text: "一道闪电落定，胜负已分。你的速度，追不上雷。" }
  - { id: VI_BOSS_THUNDER_3, winnerType: BOSS, style: PLAYFUL, targetId: BOSS_THUNDER_GUARDIAN,
      contexts: [ COMEBACK_LOSS, REPEATED_DEFEAT ], presentationType: DIALOGUE,
      text: "闪电会记住每一道尝试。下次，劈得更响！" }
  # 遗迹守护者
  - { id: VI_BOSS_RUIN_1, winnerType: BOSS, style: VILLAIN, targetId: BOSS_RUINS_GUARDIAN,
      contexts: [ NORMAL_LOSS, CLOSE_LOSS ], presentationType: DIALOGUE,
      text: "遗迹的尘埃，又厚重了一层。你不该来。" }
  - { id: VI_BOSS_RUIN_2, winnerType: BOSS, style: VILLAIN, targetId: BOSS_RUINS_GUARDIAN,
      contexts: [ CRUSHED ], presentationType: DIALOGUE,
      text: "连遗迹的回声都在嘲笑你。" }
  - { id: VI_BOSS_RUIN_3, winnerType: BOSS, style: SARCASTIC, targetId: BOSS_RUINS_GUARDIAN,
      contexts: [ COMEBACK_LOSS, REPEATED_DEFEAT ], presentationType: DIALOGUE,
      text: "哦？居然伤到我。有意思，那就认真玩。" }

  # ---------------- Boss 公共池（style 匹配，targetId 为空）----------------
  - { id: VI_BOSS_ARROGANT_N, winnerType: BOSS, style: ARROGANT, contexts: [ NORMAL_LOSS ],
      presentationType: DIALOGUE, weight: 100, text: "哼，就这点本事也想挑战我？" }
  - { id: VI_BOSS_ARROGANT_C, winnerType: BOSS, style: ARROGANT, contexts: [ CLOSE_LOSS ],
      presentationType: DIALOGUE, weight: 80, text: "差一点？那就是还差很多。" }
  - { id: VI_BOSS_SMUG_N, winnerType: BOSS, style: SMUG, contexts: [ NORMAL_LOSS ],
