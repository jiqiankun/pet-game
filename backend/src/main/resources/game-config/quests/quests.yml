# ==================== NPC 对话配置 ====================
npcs:
  - npcId: NPC_VILLAGE_ELDER
    name: 村长
    regionId: MAP_START_VILLAGE
    dialogues:
      - { nodeId: INTRO, text: 年轻的训练师，欢迎来到晨曦村。最近青草原上出现了异常的宠物活动，你能去调查一下吗？, nextNode: DETAIL }
      - { nodeId: DETAIL, text: 据说有些宠物的行为变得暴躁，似乎在守护着什么。去青原找巡逻员了解更多情况吧。, nextNode: null }

  - npcId: NPC_MEADOW_SCOUT
    name: 草原巡逻员
    regionId: MAP_AREA_MEADOW
    dialogues:
      - { nodeId: INTRO, text: 你也被派来调查了？这些宠物的异常不是偶然的，似乎有更强的力量在幕后操纵。, nextNode: DETAIL }
      - { nodeId: DETAIL, text: 草原深处的守卫者——岩甲犀，最近也变得异常活跃。也许击败它能找到答案。, nextNode: null }

  - npcId: NPC_FOREST_HERMIT
    name: 森林隐士
    regionId: MAP_AREA_FOREST
    dialogues:
      - { nodeId: INTRO, text: 哦？你居然能走到这里来。翠树林的深处已经很久没有外人踏足了。, nextNode: DETAIL }
      - { nodeId: DETAIL, text: 森林之王——翠牙狼，是这片林地的守护者。它的力量源于自然本身。如果你能战胜它，或许能打开更远的道路。, nextNode: EXTRA }
      - { nodeId: EXTRA, text: 顺便说一句，静水湖域和雷鸣高地那边，最近也不太平静。你可能需要去那边看看。, nextNode: null }

  - npcId: NPC_WATERS_KEEPER
    name: 湖域守护者
    regionId: MAP_AREA_WATERS
    dialogues:
      - { nodeId: INTRO, text: 你来了。水脉的异动已经持续了很久，湖底的守护者已经变得暴躁不安。, nextNode: DETAIL }
      - { nodeId: DETAIL, text: 潮汐蟒是这片水域的守护灵兽。只有击败它，才能净化水脉的异常。准备好了吗？, nextNode: null }

  - npcId: NPC_THUNDER_SAGE
    name: 雷鸣贤者
    regionId: MAP_AREA_THUNDER
    dialogues:
      - { nodeId: INTRO, text: 雷鸣高地的雷电已经失控了。紫电龙——这片土地的主宰，正在暴走。, nextNode: DETAIL }
      - { nodeId: DETAIL, text: 你需要证明自己的实力才能平息它的怒火。收集雷鸣高地的资源，做好充分准备再来挑战。, nextNode: null }

  - npcId: NPC_RUINS_GUIDE
    name: 遗迹向导
    regionId: MAP_AREA_RUINS
    dialogues:
      - { nodeId: INTRO, text: 终于有人来了。这座远古遗迹蕴含着超乎想象的力量，而守护者——冥渊龙正在最深处等待。, nextNode: DETAIL }
      - { nodeId: DETAIL, text: 只有同时掌握水脉与雷霆之力的训练师，才有资格挑战最终守护者。去吧，证明你配得上这份荣耀。, nextNode: null }

  - npcId: NPC_LOST_TRAVELER
    name: 迷路旅人
    regionId: MAP_AREA_MEADOW
    dialogues:
      - { nodeId: INTRO, text: 太好了！终于有人来了！我在草原迷路了好久，你能帮我指路回晨曦村吗？, nextNode: null }

  - npcId: NPC_SHADOW_SPIRIT
    name: 神秘影子
    regionId: MAP_AREA_FOREST
    dialogues:
      - { nodeId: INTRO, text: ……你能看到我？很久没有人能看到我了。, nextNode: DETAIL }
      - { nodeId: DETAIL, text: 我是这片森林的古老守护灵。如果你能证明自己的实力，我愿意成为你的伙伴。, nextNode: null }

  - npcId: NPC_FOREST_MERCHANT
    name: 旅行商人
    regionId: MAP_AREA_FOREST
    dialogues:
      - { nodeId: INTRO, text: 感谢你清理了商路！现在我可以在这做生意了。以后欢迎常来！, nextNode: null }

# ==================== 新手教学 ====================
tutorials:
  - stepId: TUT_MOVE
    name: 移动操作
    description: 使用方向键或 WASD 移动角色，探索这个世界。
    triggerType: ARRIVE
    triggerTarget: MAP_AREA_MEADOW
    order: 1
    skippable: true

  - stepId: TUT_ENCOUNTER
    name: 野生遭遇
    description: 靠近野生宠物会触发战斗。使用技能击败对手来积累经验。
    triggerType: DEFEAT
    triggerTarget: "*"
    order: 2
    skippable: true

  - stepId: TUT_CAPTURE
    name: 捕捉宠物
    description: 在野生战斗中使用捕捉球可以捕获宠物。HP 越低捕获率越高！
    triggerType: CAPTURE
    triggerTarget: "*"
    order: 3
    skippable: true
    rewards:
      - { type: SKILL_BOOK, itemId: ITEM_SKILL_BOOK_LEAVE_ALIVE, quantity: 1 }

  - stepId: TUT_EXP_POOL
    name: 经验池
    description: 战斗获得的经验会进入公共经验池。你可以自由分配经验给任意宠物升级。
    triggerType: DEFEAT
    triggerTarget: "*"
    order: 4
    skippable: true

  - stepId: TUT_FREE_POINTS
    name: 自由加点
    description: 每次升级会获得自由属性点。在宠物详情页分配点数来强化宠物。
    triggerType: DEFEAT
    triggerTarget: "*"
    order: 5
    skippable: true

  - stepId: TUT_SKILLS
    name: 技能系统
    description: 宠物升级会自动学习新技能。在技能标签页装备或卸下技能。
    triggerType: DEFEAT
    triggerTarget: "*"
    order: 6
    skippable: true

  - stepId: TUT_ELEMENTS
    name: 属性克制
    description: 9 种属性相互克制。克制时伤害 ×1.5，被克制时 ×0.75。合理搭配队伍很重要！
    triggerType: DEFEAT
    triggerTarget: "*"
    order: 7
    skippable: true

  - stepId: TUT_TEAM
    name: 队伍编成
    description: 你可以携带最多 6 只宠物，其中 3 只上场战斗。在队伍页面调整阵容。
    triggerType: CAPTURE
    triggerTarget: "*"
    order: 8
    skippable: true

  - stepId: TUT_BOSS
    name: Boss 挑战
    description: 每个区域都有强大的 Boss。击败 Boss 可获得稀有奖励并推进剧情。
    triggerType: BOSS
    triggerTarget: "*"
    order: 9
    skippable: true
