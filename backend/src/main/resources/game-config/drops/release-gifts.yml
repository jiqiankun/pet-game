# ============================================================
# 宠物精灵游戏 - 放生礼物配置（阶段 5）
# ============================================================
# 放生宠物后按「礼物价值点数」从礼物池按权重抽取，直到累计价值 ≥ 应得点数。
# 应得点数 = 基础值(稀有度，见 system.yml) × 捕获等级系数 × 培养系数（决策七）。
# unitValue 表示单份礼物折算的价值点数。
# ============================================================

configVersion: 1

gifts:
  - type: GOLD
    unitValue: 1
    weight: 50
    description: 金币（1 金币 = 1 点）

  - type: EXP
    unitValue: 1
    weight: 30
    description: 经验（1 经验 = 1 点，进入公共经验池）

  - type: ITEM
    itemId: ITEM_POTION_SMALL
    quantity: 1
    unitValue: 10
    weight: 20
    description: 小型恢复药 ×1（折价 10 点）
