      - { objectiveId: OBJ_10_2, type: GATHER, targetId: GATHER_RUINS_1, targetCount: 3, description: 在遗迹采集 3 次 }
      - { objectiveId: OBJ_10_3, type: CAPTURE, targetId: PET_DARK_002, targetCount: 1, description: 捕获 1 只遗迹宠物 }
    rewards:
      fixed:
        - { type: GOLD, quantity: 800 }
        - { type: EXP, quantity: 2000 }

  - id: QUEST_MAIN_11
    name: 远古守护者
    type: MAIN
    description: 最终的考验——击败远古遗迹的守护者，完成第一阶段冒险。
    regionId: MAP_AREA_RUINS
    prerequisiteQuestId: QUEST_MAIN_10
    hidden: false
    objectives:
      - { objectiveId: OBJ_11_1, type: DEFEAT_BOSS, targetId: BOSS_RUINS_GUARDIAN, targetCount: 1, description: 击败远古守护者·冥渊龙 }
    rewards:
      fixed:
        - { type: GOLD, quantity: 3000 }
        - { type: EXP, quantity: 5000 }
      choices:
        - choiceId: CHOICE_11_1
          options:
            - { type: ITEM, itemId: ITEM_CAPTURE_BALL_ULTRA, quantity: 10 }
