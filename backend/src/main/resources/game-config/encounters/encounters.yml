# ============================================================
# 宠物精灵游戏 - 野生遭遇配置（阶段 5 基础，阶段 6 按地图细化）
# ============================================================
# 按权重生成野生阵容（种族、等级范围）。
# 地图只声明「哪里用哪个刷新组」（阶段 6：maps/maps.yml 区域声明允许的刷新组），
# 宠物与概率全部在此配置中（数据分离原则）。
# 奖励 = expPerLevel/goldPerLevel × 敌等级 × 稀有度系数（system.yml）；被捕捉宠物不参与。
# ============================================================

configVersion: 1

encounterGroups:
