    name: 水脉之源
    type: MAIN
    description: 森林隐士提到了静水湖域的异常，前往调查水源的变化。
    regionId: MAP_AREA_WATERS
    prerequisiteQuestId: QUEST_MAIN_04
    hidden: false
    objectives:
      - { objectiveId: OBJ_05_1, type: ARRIVE, targetId: MAP_AREA_WATERS, targetCount: 1, description: 到达静水湖域 }
      - { objectiveId: OBJ_05_2, type: CAPTURE, targetId: PET_WATER_003, targetCount: 1, description: 捕获 1 只水域宠物 }
      - { objectiveId: OBJ_05_3, type: DEFEAT, targetId: PET_WATER_002, targetCount: 5, regionId: MAP_AREA_WATERS, description: 击败 5 只水域宠物 }
      - { objectiveId: OBJ_05_4, type: DIALOGUE, targetId: NPC_WATERS_KEEPER, targetCount: 1, description: 与湖域守护者对话 }
    rewards:
      fixed:
        - { type: GOLD, quantity: 500 }
        - { type: EXP, quantity: 1200 }
      choices:
        - choiceId: CHOICE_05_1
          options:
            - { type: ITEM, itemId: ITEM_CAPTURE_BALL_ULTRA, quantity: 3 }
            - { type: ITEM, itemId: ITEM_REVIVE, quantity: 5 }
            - { type: ITEM, itemId: ITEM_POTION_LARGE, quantity: 8 }

  - id: QUEST_MAIN_07
    name: 湖泊守卫者
    type: MAIN
    description: 挑战静水湖域的守护者，净化水脉的异常。
    regionId: MAP_AREA_WATERS
    prerequisiteQuestId: QUEST_MAIN_05
    hidden: false
    objectives:
      - { objectiveId: OBJ_07_1, type: DEFEAT_BOSS, targetId: BOSS_WATERS_GUARDIAN, targetCount: 1, description: 击败湖域守护者·潮汐蟒 }
    rewards:
      fixed:
        - { type: GOLD, quantity: 1000 }
        - { type: EXP, quantity: 2000 }

  # --- 雷属性分支 ---
  - id: QUEST_MAIN_06
    name: 雷鸣的呼唤
    type: MAIN
    description: 翠树林的古老石碑指引你前往雷鸣高地，探寻雷之力量的源头。
    regionId: MAP_AREA_THUNDER
    prerequisiteQuestId: QUEST_MAIN_04
    hidden: false
    objectives:
      - { objectiveId: OBJ_06_1, type: ARRIVE, targetId: MAP_AREA_THUNDER, targetCount: 1, description: 到达雷鸣高地 }
      - { objectiveId: OBJ_06_2, type: GATHER, targetId: GATHER_THUNDER_1, targetCount: 3, description: 在雷鸣高地采集 3 次 }
      - { objectiveId: OBJ_06_3, type: CAPTURE, targetId: PET_THUNDER_003, targetCount: 1, description: 捕获 1 只雷属性宠物 }
      - { objectiveId: OBJ_06_4, type: DIALOGUE, targetId: NPC_THUNDER_SAGE, targetCount: 1, description: 与雷鸣贤者对话 }
    rewards:
      fixed:
        - { type: GOLD, quantity: 500 }
        - { type: EXP, quantity: 1200 }
      choices:
        - choiceId: CHOICE_06_1
          options:
            - { type: ITEM, itemId: ITEM_CAPTURE_BALL_ULTRA, quantity: 3 }
            - { type: ITEM, itemId: ITEM_REVIVE, quantity: 5 }
            - { type: ITEM, itemId: ITEM_POTION_LARGE, quantity: 8 }

  - id: QUEST_MAIN_08
    name: 雷霆之主
    type: MAIN
    description: 挑战雷鸣高地的守护者，平息雷霆的暴走。
    regionId: MAP_AREA_THUNDER
    prerequisiteQuestId: QUEST_MAIN_06
    hidden: false
