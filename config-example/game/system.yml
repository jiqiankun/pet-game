# ============================================================
# 宠物精灵游戏 - 系统配置 (外部覆盖)
# ============================================================
# 此文件为游戏系统配置的外部覆盖文件。
# 放置在 ./config/game/ 目录下，启动时自动加载，
# 相同配置项会覆盖 JAR 内部的默认值。
#
# 注意：此文件仅包含系统级配置。
# 游戏内容配置（宠物、技能、地图等）由独立的 YAML 文件管理。
# ============================================================

# --- 游戏版本信息 ---
game:
  # 游戏发布版本号（显示在界面和日志中）
  version: "1.0.0"

  # 存档数据结构版本（存档兼容性校验用）
  save-version: 1

  # 游戏配置结构版本（配置文件兼容性校验用）
  config-version: 1

  # 外部游戏配置目录路径（相对于启动目录）
  config-dir: "./config/game"

  # 开发者模式（true 开启开发者工具与调试接口）
  developer-mode: false
