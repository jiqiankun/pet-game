# ============================================================
# 宠物精灵游戏 - 成就配置（阶段 11）
# ============================================================
# 成就采用事件记录驱动：每个成就有独立的 conditionType/conditionValue/conditionCount，
# 由 AchievementService 在既有结算点事件触发时按条件类型从玩家状态快照计算是否达成。
# 奖励为金币/经验/捕捉球/材料/称号/头像/徽章，不增加永久大量战斗属性（需求 §110）。
#
# 分类 category：EXPLORE(探索) / CAPTURE(捕捉) / BREED(培养) /
#                BATTLE(战斗) / BOSS / POKEDEX(图鉴) / SPECIAL(特殊)
# 条件类型 conditionType 参考 AchievementService 支持列表。
# 统计项 key 参考 StatisticsService 定义的统计键。
# ============================================================

configVersion: 1
achievements:
