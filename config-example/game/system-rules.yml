# ============================================================
# 宠物精灵游戏 - 系统规则配置 (外部覆盖示例)
# ============================================================
# 将此文件放置在 ./config/game/ 目录下，启动时自动覆盖 JAR 内部默认值。
# 修改后需重启生效。
# 仅列出需要覆盖的字段，未列出的字段使用默认值。
# ============================================================

configVersion: 1

# 如需调整克制倍率，取消注释并修改：
# advantageMultiplier: 1.50
# disadvantageMultiplier: 0.75
# sameElementBonus: 1.20

# 如需调整暴击参数：
# critRate: 0.05
# critMultiplierMin: 1.4
# critMultiplierMax: 2.0

# 如需调整等级上限：
# levelCap: 50

# --- 游戏完成度权重（阶段 11，需求 §111/§138） ---
# 各分项权重之和应为 100；完成度 = Σ(权重 × 单项进度)。
# 100% 不要求 S 资质、特殊外观、稀有技能或 Boss 噩梦全通。
# completion:
#   mainQuestWeight: 20.0        # 主线
#   regionWeight: 10.0           # 区域
#   discoveryWeight: 10.0        # 宠物发现
#   captureWeight: 25.0          # 宠物捕获
#   researchWeight: 10.0         # 图鉴研究
#   bossWeight: 15.0             # Boss
#   hiddenRegionWeight: 5.0      # 隐藏区域
#   sideQuestWeight: 5.0         # 主要支线
