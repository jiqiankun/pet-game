# ============================================================
# 宠物精灵游戏 - Boss 挑战目标配置（阶段 11）
# ============================================================
# 每个主要 Boss 设 4 个挑战目标（决策四）：指定回合内击败、不使用恢复道具、
# 无宠物失去战斗能力、使用多种不同属性宠物取胜；仅在击败场次中判定，任意难度均可计入。
# 单目标首次完成发放成就 + 一次性实用奖励；集齐某 Boss 全部目标授予该 Boss 专属称号。
# 隐藏/精英 Boss 不设挑战目标。
#
# 目标类型 type：TURN_LIMIT / NO_RECOVERY_ITEM / NO_PET_FAINTED / MULTI_ELEMENT
#   - TURN_LIMIT：value = 回合上限
#   - NO_RECOVERY_ITEM：不使用恢复道具（value 恒为 1）
#   - NO_PET_FAINTED：无宠物失去战斗能力（value 恒为 1）
#   - MULTI_ELEMENT：使用 value 种不同属性宠物（默认 3）
# ============================================================

configVersion: 1
