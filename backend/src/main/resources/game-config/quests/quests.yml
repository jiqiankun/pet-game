    hidden: false
    objectives:
      - { objectiveId: OBJ_09_1, type: ARRIVE, targetId: MAP_AREA_RUINS, targetCount: 1, description: 进入远古遗迹 }
      - { objectiveId: OBJ_09_2, type: DIALOGUE, targetId: NPC_RUINS_GUIDE, targetCount: 1, description: 与遗迹向导对话 }
