    rewards:
      fixed:
        - { type: GOLD, quantity: 1000 }
        - { type: EXP, quantity: 2000 }

  # --- 最终遗迹 ---
  - id: QUEST_MAIN_09
    name: 遗迹之门
    type: MAIN
    description: 水脉与雷霆的力量已净化，远古遗迹的大门向你敞开。
