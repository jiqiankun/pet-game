    name: 青草原野怪
    teamSizeMin: 1
    teamSizeMax: 2
    expPerLevel: 15
    goldPerLevel: 3
    species:
      - { speciesId: PET_WOOD_001, weight: 12, levelMin: 2, levelMax: 6 }
      - { speciesId: PET_WOOD_002, weight: 12, levelMin: 2, levelMax: 6 }
