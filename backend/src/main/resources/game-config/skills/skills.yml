  # ---------- 通用功能技能 ----------

  # 留生一击（REV-014，需求 §142）：通用捕获辅助技能书技能。
  # 致死伤害保留可捕捉目标 1HP（暴击不可绕过）；仅触发保护时清除 DOT
  # 并对可捕捉目标附加震慑；Boss 正常受伤但不附加震慑。
  # 阶段 5 临时获取：新游戏赠送 + 开发者补充；商店/教学赠书属阶段 9/10。
  - id: SKILL_LEAVE_AT_ONE_HP
    name: 留生一击
    description: 致死伤害时保留可捕捉目标 1HP，触发保护时清除其持续伤害并附加震慑。
    element: NONE
    rarity: NORMAL
    source: BOOK
    skillType: ACTIVE
    damageType: PHYSICAL
    effectType: DAMAGE
    target: ENEMY_SINGLE
    baseValue: 50
    maxOf: [STRENGTH, SPIRIT]
    maxOfCoefficient: 1.0
    cooldown: 0
    accuracy: 1.0
    tags: [CAPTURE_ASSIST, DAMAGE]
    effects:
      - { type: LEAVE_AT_ONE_HP }
      - { type: REMOVE_STATUS, dotOnly: true, onProtect: true }
      - { type: APPLY_STATUS, statusId: CAPTURE_STUN, onProtect: true, capturableOnly: true }

