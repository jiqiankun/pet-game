# ============================================================
# 宠物精灵游戏 - 任务配置（阶段 9）
# ============================================================
# 主线任务驱动区域推进直至通关；支线提供轻量目标并可永久改变地图；
# 隐藏任务未触发前不显示。条件类型为有限枚举，不建通用脚本引擎。
# 目标类型：DIALOGUE / GATHER / CAPTURE / DEFEAT / DEFEAT_BOSS / ARRIVE
# ============================================================

configVersion: 1

# ==================== 任务列表 ====================
quests:

  # ==================== 主线（12 节点） ====================

  # --- 青草原线 ---
  - id: QUEST_MAIN_01
    name: 异常的预兆
    type: MAIN
    description: 村长提到青草原上出现了异常的宠物活动，前去调查。
    regionId: MAP_AREA_MEADOW
    prerequisiteQuestId: null
    hidden: false
    objectives:
      - { objectiveId: OBJ_01_1, type: DIALOGUE, targetId: NPC_VILLAGE_ELDER, targetCount: 1, description: 与村长对话 }
      - { objectiveId: OBJ_01_2, type: ARRIVE, targetId: MAP_AREA_MEADOW, targetCount: 1, description: 前往青草原 }
      - { objectiveId: OBJ_01_3, type: DEFEAT, targetId: PET_WOOD_001, targetCount: 3, regionId: MAP_AREA_MEADOW, description: 击败 3 只草原宠物 }
      - { objectiveId: OBJ_01_4, type: DIALOGUE, targetId: NPC_MEADOW_SCOUT, targetCount: 1, description: 与草原巡逻员对话 }
    rewards:
      fixed:
        - { type: GOLD, quantity: 200 }
        - { type: EXP, quantity: 500 }
        - { type: ITEM, itemId: ITEM_POTION_MEDIUM, quantity: 5 }

  - id: QUEST_MAIN_02
    name: 草原守卫
    type: MAIN
    description: 击败青草原的守护者，证明你的实力。
    regionId: MAP_AREA_MEADOW
    prerequisiteQuestId: QUEST_MAIN_01
    hidden: false
    objectives:
      - { objectiveId: OBJ_02_1, type: DEFEAT_BOSS, targetId: BOSS_MEADOW_GUARDIAN, targetCount: 1, description: 击败草原守卫·岩甲犀 }
    rewards:
      fixed:
        - { type: GOLD, quantity: 500 }
        - { type: EXP, quantity: 1000 }
      choices:
        - choiceId: CHOICE_02_1
          options:
            - { type: ITEM, itemId: ITEM_CAPTURE_BALL_GREAT, quantity: 10 }
            - { type: ITEM, itemId: ITEM_REVIVE, quantity: 3 }
            - { type: ITEM, itemId: ITEM_POTION_LARGE, quantity: 5 }

  # --- 翠树林线 ---
  - id: QUEST_MAIN_03
    name: 深入翠树林
    type: MAIN
    description: 草原的异常似乎与翠树林深处的变化有关，前去调查。
    regionId: MAP_AREA_FOREST
    prerequisiteQuestId: QUEST_MAIN_02
    hidden: false
    objectives:
      - { objectiveId: OBJ_03_1, type: ARRIVE, targetId: MAP_AREA_FOREST, targetCount: 1, description: 进入翠树林 }
      - { objectiveId: OBJ_03_2, type: CAPTURE, targetId: PET_WOOD_003, targetCount: 1, description: 捕获 1 只翠树林宠物 }
      - { objectiveId: OBJ_03_3, type: GATHER, targetId: GATHER_FOREST_1, targetCount: 2, description: 在翠树林采集 2 次 }
      - { objectiveId: OBJ_03_4, type: DIALOGUE, targetId: NPC_FOREST_HERMIT, targetCount: 1, description: 与森林隐士对话 }
    rewards:
      fixed:
        - { type: GOLD, quantity: 300 }
        - { type: EXP, quantity: 800 }

  - id: QUEST_MAIN_04
    name: 森林之王
    type: MAIN
    description: 挑战翠树林的守护者，揭开异常的真相。
    regionId: MAP_AREA_FOREST
    prerequisiteQuestId: QUEST_MAIN_03
    hidden: false
    objectives:
      - { objectiveId: OBJ_04_1, type: DEFEAT_BOSS, targetId: BOSS_FOREST_KING, targetCount: 1, description: 击败森林之王·翠牙狼 }
    rewards:
      fixed:
        - { type: GOLD, quantity: 800 }
        - { type: EXP, quantity: 1500 }
      choices:
        - choiceId: CHOICE_04_1
          options:
            - { type: ITEM, itemId: ITEM_CAPTURE_BALL_ULTRA, quantity: 5 }
            - { type: ITEM, itemId: ITEM_REVIVE, quantity: 5 }
            - { type: ITEM, itemId: ITEM_POTION_LARGE, quantity: 8 }
    # 击败森林 Boss 后解锁水域和雷域（并行分支）
    unlockRegionId: MAP_AREA_WATERS,MAP_AREA_THUNDER

  # --- 水域分支 ---
