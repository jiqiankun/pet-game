      - { objectiveId: OBJ_12_1, type: DIALOGUE, targetId: NPC_RUINS_GUIDE, targetCount: 1, description: 与遗迹向导对话 }
    rewards:
      fixed:
        - { type: GOLD, quantity: 1000 }
        - { type: EXP, quantity: 3000 }

