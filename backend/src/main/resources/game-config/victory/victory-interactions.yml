  # ---------------- Boss 通用回退（style 为空，任意 Boss 可用）----------------
  - { id: VI_BOSS_GENERIC_N, winnerType: BOSS, contexts: [ NORMAL_LOSS ],
      presentationType: DIALOGUE, weight: 100, text: "胜利的咆哮，回荡在你耳畔。" }
  - { id: VI_BOSS_GENERIC_C, winnerType: BOSS, contexts: [ CLOSE_LOSS ],
