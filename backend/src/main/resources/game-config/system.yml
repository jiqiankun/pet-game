# ============================================================
# 宠物精灵游戏 - 系统规则配置
# ============================================================
# 定义游戏核心数值规则。所有倍率、上限、数量均可通过外部配置覆盖。
# 修改后需重启生效。
# ============================================================

configVersion: 1

# ---- 属性克制倍率 ----
advantageMultiplier: 1.50
neutralMultiplier: 1.00
disadvantageMultiplier: 0.75

# ---- 本属性技能加成 ----
sameElementBonus: 1.20

# ---- 暴击 ----
critRate: 0.05
critMultiplierMin: 1.4
critMultiplierMax: 2.0

# ---- 等级与属性点 ----
levelCap: 50
freePointsPerLevel: 3
# 稀有度每 10 级额外自由点数（需求 §19：普通 0 / 稀有 2 / 珍稀 4 / 传说 6）
rarityExtraPointsPer10Levels:
  COMMON: 0
  RARE: 2
  EPIC: 4
  LEGENDARY: 6
# 升级经验公式：升到下一级所需经验 = expBase * expGrowthFactor^(当前等级-1)
# 需求 §17 未给具体数值，此公式配置化以便调整
expBase: 100
expGrowthFactor: 1.15
# 属性点转换消耗（需求 §20）
# 生命 +5 消耗 hpPointCost(1) 点；力量/灵力/防御/抗性 +1 消耗 statPointCost(1) 点；速度 +1 消耗 speedPointCost(2) 点
statPointCost: 1
hpPointCost: 1
speedPointCost: 2

# ---- 队伍 ----
maxCarryPets: 6
standardBattleSlots: 3
maxTeamPresets: 5

# ---- 资质 ----
aptitudeMin: 0
aptitudeMax: 100

# ---- 个体基础浮动（±5%） ----
baseStatVariance: 0.05

# ---- 战斗结算（阶段 3） ----
# 防御/抗性减伤：raw × K / (K + def)
defenseMitigationConstant: 200.0
# 防御行动减伤比例
defendDamageReduction: 0.50
# 正常命中最低伤害
minDamage: 1
# 自由属性点加成
freePointStatValue: 1.0
freePointHpValue: 5.0
# 等级成长（阶段 3 临时公式，阶段 4 养成体系正式化）
levelStatGrowth: 2.0
levelHpGrowth: 8.0

# ---- 放生 ----
releaseBonusMax: 0.50

# ---- 捕捉（阶段 5，需求 §46～§50） ----
# 捕获率 = 基础捕获率 × (1 - captureHpFactor × 当前HP比例) × (1 + statusCaptureBonus × min(异常数, captureStatusMaxCount))
#        × 捕捉球倍率 × 精英系数，最终 clamp 到 [0, 1]
captureHpFactor: 0.5
# 每个异常状态（DEBUFF/CONTROL）的捕获率加成
statusCaptureBonus: 0.15
# 异常状态捕获加成最多计数的状态个数
captureStatusMaxCount: 2
# 精英个体捕捉倍率（决策一 ×0.6；本阶段无精英个体）
eliteCaptureMultiplier: 0.6
# 逃跑成功率（用户裁决：必定成功）
fleeSuccessRate: 1.0
# 野生宠物低概率携带稀有技能的概率
rareSkillChance: 0.05
# 野生宠物极低概率特殊外观的概率
specialAppearanceChance: 0.01

# ---- 放生礼物（阶段 5，决策七） ----
# 礼物价值点数 = 基础值(稀有度) × 捕获等级系数(1+等级×1%，上限 1.5) × 培养系数(1.0～1.5)
releaseGiftBaseValue:
  COMMON: 20
  RARE: 60
  EPIC: 150
  LEGENDARY: 400
releaseLevelFactorPerLevel: 0.01
releaseLevelFactorCap: 1.5
releaseCultivationFactorMax: 1.5
# 培养系数满值所需已分配自由点数（培养系数 = 1 + min(已分配点数/该值, 1) × (上限-1)）
releaseCultivationPointsCap: 100
# 放生高资质额外警告阈值（平均资质 ≥ 该值时前端二次确认）
releaseWarningAptitudeThreshold: 90

# ---- 野生战斗奖励（阶段 5，用户裁决） ----
# 奖励 = 每级基础值(刷新组) × 敌等级 × 稀有度系数；被捕捉宠物不参与奖励计算
wildRewardRarityMultiplier:
  COMMON: 1.0
  RARE: 1.2
  EPIC: 1.5
  LEGENDARY: 2.0

# ---- Boss ----
luckyExchangeCost: 100
# HP 百分比交换（命运天平类，需求 §147）：Boss 单次交换幅度上限（百分点）
bossHpExchangeLimit: 0.20
